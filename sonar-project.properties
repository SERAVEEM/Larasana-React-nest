# SonarQube Project Configuration
sonar.projectKey=larasana-project
sonar.projectName=Larasana
sonar.projectVersion=1.0.0

# Path to the source directories
sonar.sources=frontend/src,backendV2/apps,backendV2/libs/shared/src

# Path to the test directories
sonar.tests=frontend/src,backendV2/apps,backendV2/libs/shared/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.cy.ts

# Exclusions from source analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,frontend/Figma design/**,frontend/src/assets/**,backendV2/larasana_db.sql

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# TypeScript configuration
sonar.typescript.tsconfigPaths=frontend/tsconfig.json,backendV2/tsconfig.json

# Test Coverage Reports paths
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backendV2/coverage/lcov.info
