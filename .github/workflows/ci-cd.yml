name: Larasana CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Lint & Unit Tests for Frontend & Backend
  # ──────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential for SonarQube to analyse Git history

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backendV2/package-lock.json

      # ── Backend ────────────────────────────────────────────────
      - name: Install Backend Dependencies
        run: |
          cd backendV2
          npm ci


      - name: Run Backend Tests (with coverage)
        # FIX #2: use test:cov (jest --coverage) instead of test -- --coverage
        run: |
          cd backendV2
          npm run test:cov -- --passWithNoTests

      # ── Frontend ───────────────────────────────────────────────
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Tests (with lcov coverage for SonarQube)
        # FIX #3: use test:ci which emits lcov.info required by SonarQube
        run: |
          cd frontend
          npm run test:ci

      # ── SonarQube ──────────────────────────────────────────────
      - name: SonarQube Scan
        # FIX #8: continue-on-error so a missing SONAR_TOKEN doesn't block the pipeline
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ──────────────────────────────────────────────────────────────
  # Job 2: End-to-End Cypress Tests
  # ──────────────────────────────────────────────────────────────
  e2e-cypress:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIX #4: Node.js setup was completely missing from this job
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # FIX #7: Create a minimal .env for backendV2 so Docker Compose doesn't
      # crash on missing env_file references. Secrets are stubs for CI only.
      - name: Create backend .env stub for Docker Compose
        run: |
          cat <<'EOF' > backendV2/.env
          NODE_ENV=test
          DB_HOST=mysql
          DB_PORT=3306
          DB_USERNAME=root
          DB_PASSWORD=
          DB_NAME=larasana
          JWT_ACCESS_SECRET=ci_access_secret
          JWT_REFRESH_SECRET=ci_refresh_secret
          FRONTEND_CLIENT_SECRET=ci_client_secret
          USERS_SERVICE_HOST=users-service
          USERS_SERVICE_PORT=3001
          COMMERCE_SERVICE_HOST=commerce-service
          COMMERCE_SERVICE_PORT=3002
          NOTIFICATION_SERVICE_HOST=notification-service
          NOTIFICATION_SERVICE_PORT=3003
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_USER=test
          MAIL_PASS=test
          MAIL_FROM="LARASANA <no-reply@larasana.id>"
          EOF

      - name: Set up Docker Compose
        run: docker compose version

      # Spin up database and backend services for the E2E environment
      - name: Start Backend Services
        run: |
          docker compose up -d mysql api-gateway users-service commerce-service notification-service caddy

      # FIX #7 cont.: Poll until MySQL healthcheck passes before Cypress starts
      - name: Wait for MySQL to be healthy
        run: |
          echo "Waiting for MySQL to be healthy..."
          for i in $(seq 1 30); do
            if docker compose exec -T mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL is healthy."
              break
            fi
            echo "Attempt $i/30 — sleeping 5s..."
            sleep 5
          done

      # Import the database schema and seed data before running tests
      - name: Import Database Dump
        run: |
          echo "Importing database dump..."
          docker compose exec -T mysql mysql -u root larasana < backendV2/larasana_db.sql
          echo "Database imported successfully."

      # FIX #5: cypress is now in devDependencies so npm ci installs it automatically.
      # FIX #6: removed build: — the dev server doesn't need a prior production build.
      #         cypress-io/github-action backgrounds `start` automatically.
      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm run dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 60
          browser: chrome
        env:
          VITE_API_BASE_URL: http://localhost:80/api/v1
          VITE_FRONTEND_CLIENT_SECRET: ci_client_secret

      - name: Upload Cypress Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Shutdown Services
        if: always()
        run: docker compose down

